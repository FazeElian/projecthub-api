services:
  postgres:
    image: postgres:17
    container_name: projecthub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: projecthub
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d projecthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: projecthub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/projecthub
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    ports:
      - "8080:8080"

volumes:
  postgres_data: